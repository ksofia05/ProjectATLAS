
<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Aplicación{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background-color: #0A0A0A;" class="bg-black text-white flex items-center justify-center min-h-screen">
    <div style="background-color: #1A1A1A;" class="bg-gray-900 p-8 rounded-lg shadow-lg w-96 border-2 border-gray-700">

        {% endblock %}
    </div>
</body>
</html>
