<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body style="background-color: #0A0A0A;" class="bg-black text-white flex items-center justify-center min-h-screen">
    <div style="background-color: #1A1A1A; border: 2px solid #232323;" class="bg-gray-900 p-8 rounded-lg shadow-lg w-96">
        <div class="flex justify-center mb-6">
            <img src="{% static 'autenticacion/logo.png' %}" alt="Logo" class="w-12">
        </div>
        <h1 class="text-2xl font-bold text-center mb-4">Iniciar sesión</h1>
        <p class="text-center text-gray-400 mb-6">Bienvenido de nuevo</p>
        <p class="text-center text-gray-400 mb-6">
            ¿No tienes una cuenta? <a href="{% url 'register' %}" class="text-purple-500 hover:underline">Regístrate</a>.
        </p>
        <form method="POST" novalidate>
            {% csrf_token %}
            <div class="mb-4">
                <label for="email" class="block text-gray-400 font-medium mb-1">Correo Electrónico</label>
                <div class="relative">
                    <input type="email" id="email" name="email" placeholder="Correo Electrónico" required
                        class="w-full px-4 py-2 bg-gray-800 text-white border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <span class="absolute inset-y-0 right-3 flex items-center text-gray-500">
                        <i class="bi bi-envelope"></i>
                    </span>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-400 font-medium mb-1">Contraseña</label>
                <div class="relative">
                    <input type="password" id="password" name="password" placeholder="Contraseña" required
                        class="w-full px-4 py-2 bg-gray-800 text-white border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <span class="absolute inset-y-0 right-3 flex items-center text-gray-500 cursor-pointer toggle-password">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>
            {% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}
            <button type="submit"
                class="w-full bg-purple-500 text-white py-2 px-4 rounded-lg hover:bg-purple-600 transition">
                Ingresar
            </button>
        </form>
        <p class="text-center text-gray-400 mt-4">
            ¿Olvidaste tu contraseña? <a href="{% url 'recuperar_contrasena' %}" class="text-purple-500 hover:underline">Recuperar contraseña</a>
        </p>
    </div>
    <script src="{% static 'autenticacion/login.js' %}"></script>
</body>
</html>
