<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'autenticacion/recuperar_contrasenaa.css' %}">
</head>
<body style="background-color: #0A0A0A;" class="bg-black text-white flex items-center justify-center min-h-screen">
    <div style="background-color: #1A1A1A; border: 2px solid #232323;" class="bg-gray-900 p-8 rounded-lg shadow-lg w-96">
        <div class="flex justify-center mb-6">
            <img src="{% static 'autenticacion/logo.png' %}" alt="Logo" class="w-12">
        </div>
        <h1 class="text-2xl font-bold text-center mb-4">¿Olvidó su contraseña?</h1>
        <p class="text-center text-gray-400 mb-6">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
        <form id="recover-form" method="POST" novalidate>
            {% csrf_token %}
            <div class="mb-4">
                <label for="email" class="block text-gray-400 font-medium mb-1">Correo Electrónico</label>
                <div class="relative">
                    <input type="email" id="email" name="email" placeholder="Correo Electrónico" required
                        class="w-full px-4 py-2 bg-gray-800 text-white border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <span class="absolute inset-y-0 right-3 flex items-center text-gray-500">
                        <i class="bi bi-envelope"></i>
                    </span>
                </div>
            </div>
            <button type="submit" class="w-full bg-purple-500 text-white py-2 px-4 rounded-lg hover:bg-purple-600 transition">Enviar enlace</button>
        </form>
    </div>

    <!-- Fondo Borroso detras de la ventana flotante -->
    <div class="overlay hidden" id="overlay"></div>

    <!-- Ventana flotante -->
    <div class="popup hidden" id="popup">
        <button class="close-btn" id="close-popup">&times;</button>
        <div class="icon">
            <i class="bi bi-send"></i>
        </div>
        <h2>El correo ha sido enviado!</h2>
        <p>No ves el correo? Dale un vistazo a tu carpeta de spam, a veces se esconde por ahí.</p>
    </div>

    <script src="{% static 'autenticacion/recuperar_contrasena.js' %}"></script>
</body>
</html>
