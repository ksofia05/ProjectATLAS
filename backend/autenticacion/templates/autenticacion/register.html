<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar cuenta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen">
    <div class="bg-gray-900 p-8 rounded-lg shadow-lg w-96">
        <div class="flex justify-center mb-6">
            <img src="{% static 'autenticacion/logo.png' %}" alt="Logo" class="w-12">
        </div>
        <h1 class="text-2xl font-bold text-center mb-4">Registrar cuenta</h1>
        <p class="text-center text-gray-400 mb-6">
            ¿Ya estás registrado? <a href="{% url 'login' %}" class="text-purple-500 hover:underline">Iniciar sesión</a>
        </p>
        <p class="text-center text-gray-400 mb-6">
            ¡Vamos a Empezar!<br>Solo necesitamos unos cuantos datos para crear tu cuenta.
        </p>
        <form method="POST" novalidate>
            {% csrf_token %}
            <div class="mb-4">
                <label for="nombre" class="block text-gray-400 font-medium mb-1">Nombres</label>
                <div class="relative">
                    <input type="text" id="nombre" name="nombre" placeholder="Nombres" required
                        class="w-full px-4 py-2 bg-gray-800 text-white border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <span class="absolute inset-y-0 right-3 flex items-center text-gray-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A3 3 0 015 16.5V7.5a3 3 0 013-3h8a3 3 0 013 3v9a3 3 0 01-.121.804M9 12h6m-3-3v6" />
                        </svg>
                    </span>
                </div>
            </div>
            <div class="mb-4">
                <label for="apellido" class="block text-gray-400 font-medium mb-1">Apellidos</label>
                <div class="relative">
                    <input type="text" id="apellido" name="apellido" placeholder="Apellidos" required
                        class="w-full px-4 py-2 bg-gray-800 text-white border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <span class="absolute inset-y-0 right-3 flex items-center text-gray-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A3 3 0 015 16.5V7.5a3 3 0 013-3h8a3 3 0 013 3v9a3 3 0 01-.121.804M9 12h6m-3-3v6" />
                        </svg>
                    </span>
                </div>
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-400 font-medium mb-1">Correo</label>
                <div class="relative">
                    <input type="email" id="email" name="email" placeholder="Correo" required
                        class="w-full px-4 py-2 bg-gray-800 text-white border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <span class="absolute inset-y-0 right-3 flex items-center text-gray-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12H8m8 0a4 4 0 01-8 0m8 0a4 4 0 00-8 0m8 0V8a4 4 0 00-8 0v4m8 0v4a4 4 0 01-8 0v-4" />
                        </svg>
                    </span>
                </div>
            </div>
            <button type="submit"
                class="w-full bg-purple-500 text-white py-2 px-4 rounded-lg hover:bg-purple-600 transition">
                Siguiente
            </button>
        </form>
    </div>
    <script src="{% static 'autenticacion/register.js' %}"></script>
</body>
</html>
