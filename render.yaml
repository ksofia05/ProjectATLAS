services:
  - type: web
    name: projectatlas-backend
    env: python
    buildCommand: |
      cd backend
      pip install --upgrade pip
      pip install -r requirements.txt
      export DJANGO_SETTINGS_MODULE=backend.settings_production
      python manage.py makemigrations --noinput
      python manage.py showmigrations
      python manage.py collectstatic --noinput --clear
    startCommand: |
      cd backend
      export DJANGO_SETTINGS_MODULE=backend.settings_production
      python manage.py migrate --noinput
      python manage.py migrate --run-syncdb --noinput
      gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level debug
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: true  # ← Temporalmente true para ver errores
      - key: RENDER
        value: true
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings_production
      - key: DATABASE_URL
        fromDatabase:
          name: projectatlas-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "projectatlas-backend.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://projectatlas-frontend.onrender.com,http://localhost:3000"

  - type: web
    name: projectatlas-frontend
    env: static
    buildCommand: |
      cd frontend
      npm ci
      npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: "https://projectatlas-backend.onrender.com"
      - key: VITE_SUPABASE_URL
        value: "https://ukpjvbvzqmehjormyrza.supabase.co"
      - key: VITE_SUPABASE_ANON_KEY
        value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrcGp2YnZ6cW1laGpvcm15cnphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY0NTc0NTAsImV4cCI6MjA2MjAzMzQ1MH0.P5GMA5JQMyIKW85Co9lT7nGOQCl1f6SGtU05Jntmh0U"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
